<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/Anton-Regular.ttf"); }
      :root { --ground: #07131F; --ink: #ffffff; --teal: #2BC4CF; --orange: #F2541B; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Anton", sans-serif; }
      .full { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #escudo { position: absolute; left: 270px; top: 520px; width: 540px; }
      #bordao { position: absolute; top: 1140px; width: 100%; text-align: center; color: var(--ink); font-size: 108px; line-height: 1.05; }
      #bordao span { color: var(--teal); }
      #num { position: absolute; top: 620px; width: 100%; text-align: center; color: var(--teal); font-size: 420px; }
      #lbl { position: absolute; top: 1140px; width: 100%; text-align: center; color: var(--ink); font-size: 90px; }
      #bar { position: absolute; left: 0; top: 0; height: 8px; width: 1080px; background: var(--orange); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <img id="escudo" class="clip" src="assets/escudo.png" data-start="0" data-duration="3" data-track-index="1" />
      <div id="bordao" class="clip" data-start="0" data-duration="3" data-track-index="2">VAMOS DIRETO<br /><span>DO CAMPO À TELA.</span></div>
      <div id="num" class="clip" data-start="3" data-duration="3" data-track-index="1">0/9</div>
      <div id="lbl" class="clip" data-start="3" data-duration="3" data-track-index="2">DUELOS 1x1 VENCIDOS</div>
      <img id="quadro" class="full clip" src="assets/quadro.jpg" data-start="6" data-duration="3" data-track-index="1" />
      <div id="bar" class="clip" data-start="0" data-duration="9" data-track-index="9"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#escudo", { scale: 0.6, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 0);
      tl.fromTo("#bordao", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.35);
      const c = { v: 0 };
      tl.fromTo("#num", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" }, 3);
      tl.to(c, { v: 9, duration: 1.2, ease: "power2.out", onUpdate: () => { document.getElementById("num").textContent = Math.round(c.v) + "/9"; } }, 3.1);
      tl.fromTo("#lbl", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 3.4);
      tl.fromTo("#quadro", { scale: 1.08 }, { scale: 1.0, duration: 3, ease: "power1.out" }, 6);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 9, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
